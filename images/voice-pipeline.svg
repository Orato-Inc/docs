<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="220" rx="16" fill="#FBF7F3"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4622D"/>
    </marker>
  </defs>
  <g text-anchor="middle">
    <text x="70" y="104" font-size="15" fill="#333">Caller</text>
    <text x="70" y="124" font-size="12" fill="#777">speaks</text>
    <line x1="115" y1="110" x2="165" y2="110" stroke="#C4622D" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="175" y="60" width="170" height="100" rx="12" fill="#fff" stroke="#C4622D" stroke-width="2"/>
    <text x="260" y="100" font-size="17" font-weight="600" fill="#C4622D">Transcriber</text>
    <text x="260" y="122" font-size="12" fill="#555">Speech to text</text>
    <text x="260" y="140" font-size="11" fill="#888">Deepgram, Sarvam AI</text>
    <line x1="345" y1="110" x2="385" y2="110" stroke="#C4622D" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="395" y="60" width="170" height="100" rx="12" fill="#fff" stroke="#C4622D" stroke-width="2"/>
    <text x="480" y="100" font-size="17" font-weight="600" fill="#C4622D">AI model</text>
    <text x="480" y="122" font-size="12" fill="#555">Decides the reply</text>
    <text x="480" y="140" font-size="11" fill="#888">Anthropic, OpenAI, Google...</text>
    <line x1="565" y1="110" x2="605" y2="110" stroke="#C4622D" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="615" y="60" width="170" height="100" rx="12" fill="#fff" stroke="#C4622D" stroke-width="2"/>
    <text x="700" y="100" font-size="17" font-weight="600" fill="#C4622D">Voice engine</text>
    <text x="700" y="122" font-size="12" fill="#555">Text to speech</text>
    <text x="700" y="140" font-size="11" fill="#888">Cartesia, ElevenLabs...</text>
    <line x1="785" y1="110" x2="825" y2="110" stroke="#C4622D" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="860" y="104" font-size="15" fill="#333">Caller</text>
    <text x="860" y="124" font-size="12" fill="#777">hears</text>
  </g>
  <text x="450" y="195" text-anchor="middle" font-size="12" fill="#888">The loop repeats for every turn of the conversation</text>
</svg>
